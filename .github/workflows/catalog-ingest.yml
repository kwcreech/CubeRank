name: Catalog ingest

on:
  # Emergency-only. The weekly schedule was removed so this job does not
  # fetch store catalogs automatically. Trigger manually if ever needed.
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Spring catalog ingest
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          INGEST_CRON_SECRET: ${{ secrets.INGEST_CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ] || [ -z "$INGEST_CRON_SECRET" ]; then
            echo "BACKEND_BASE_URL and INGEST_CRON_SECRET secrets are required"
            exit 1
          fi
          BASE="${BACKEND_BASE_URL%/}"
          curl --fail --show-error --silent \
            -X POST "${BASE}/api/internal/catalog/ingest" \
            -H "X-Ingest-Secret: ${INGEST_CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 900
