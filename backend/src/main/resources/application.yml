spring:
  application:
    name: cuberank-backend

  # Load backend/.env when present. Spring Boot 4 no longer reliably runs custom
  # EnvironmentPostProcessors registered via the old .imports mechanism, so use
  # the built-in config import instead (working directory = backend/ for mvnw).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}

server:
  port: ${PORT:8080}

# Application-specific configuration. See backend/.env.example for the full
# list of environment variables this project expects.
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}

  supabase:
    issuer-uri: ${SUPABASE_ISSUER_URI}

  ingest:
    shared-secret: ${INGEST_CRON_SECRET}
    base-url: https://www.thecubicle.com
    page-size: 250
    request-delay-ms: 250
    # Matched as case-insensitive substrings against title + tags.
    # Keep these specific — short tokens like "mat" would false-positive on "magnetic".
    blocked-keywords:
      - lube
      - lubricant
      - apparel
      - t-shirt
      - hoodie
      - cube mat
      - timer
      - bottle
      - socks
      - sticker set
    collections:
      - handle: 2x2-speed-cubes
        type: 2x2
      - handle: 3x3-speed-cubes
        type: 3x3
      - handle: 4x4-speed-cubes
        type: 4x4
      - handle: 5x5-speed-cubes
        type: 5x5
      - handle: 6x6-speed-cubes
        type: 6x6
      - handle: 7x7-speed-cubes
        type: 7x7
      - handle: megaminx
        type: Megaminx
      - handle: pyraminx
        type: Pyraminx
      - handle: skewb
        type: Skewb
      - handle: square-1
        type: Square-1
      - handle: magic-clocks
        type: Clock
        # Non-WCA Clock shape mods / sizes (matched case-insensitively in title or handle).
        excluded-title-substrings:
          - triangle
          - pentagram
          - hexagram
          - 4x4
          - 5x5
          - 6x6
          - 7x7
      - handle: fto
        type: FTO
        required-tags:
          - Type_3x3

  leaderboard:
    bayesian-prior-strength: ${LEADERBOARD_PRIOR_STRENGTH:8}

  openai:
    api-key: ${OPENAI_API_KEY:}
    embedding-model: text-embedding-3-small
    chat-model: gpt-4o-mini
    base-url: https://api.openai.com/v1

logging:
  level:
    com.cuberank.backend: INFO
